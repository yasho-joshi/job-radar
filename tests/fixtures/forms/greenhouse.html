<!doctype html><html><head><meta charset="utf-8"><title>Job Application for Senior Product Manager at Testco</title>
<script src="_done.js"></script></head><body>
<form onsubmit="return jrSubmit(event, 'Thank you for applying.')">
<label for="first_name">First Name*</label><input id="first_name" required>
<label for="last_name">Last Name*</label><input id="last_name" required>
<label for="email">Email*</label><input id="email" type="text" required>
<label for="phone">Phone*</label><input id="phone" type="tel" required>
<label for="resume">Resume/CV</label><input id="resume" type="file" required>
<div class="field"><label id="q1-label" for="question_1">Are you legally authorized to work in India?*</label>
  <input id="question_1" role="combobox" aria-labelledby="q1-label" aria-required="true" autocomplete="off">
  <div id="q1-list" role="listbox" style="display:none"></div></div>
<label for="question_2">Will you now or in the future require sponsorship for employment visa status in the United States?*</label>
<select id="question_2" required><option value="">Select...</option><option>Yes</option><option>No</option></select>
<label for="question_3">What are your salary expectations?*</label><textarea id="question_3" required></textarea>
<label for="question_4">Why do you want to work at Testco?*</label><textarea id="question_4" required></textarea>
<fieldset><legend>Gender</legend>
  <label><input type="radio" name="gender" value="Male">Male</label>
  <label><input type="radio" name="gender" value="Female">Female</label>
  <label><input type="radio" name="gender" value="Decline">Decline to self-identify</label></fieldset>
<button type="submit">Submit application</button><p id="err"></p>
</form>
<script>
const opts = ['Yes', 'No']; const inp = document.getElementById('question_1'); const list = document.getElementById('q1-list');
function show() { list.innerHTML = ''; opts.filter(o => o.toLowerCase().startsWith(inp.value.toLowerCase())).forEach(o => {
  const d = document.createElement('div'); d.setAttribute('role', 'option'); d.textContent = o;
  d.onclick = () => { inp.value = o; inp.setAttribute('data-picked', o); list.style.display = 'none'; }; list.appendChild(d); });
  list.style.display = 'block'; }
inp.addEventListener('focus', show); inp.addEventListener('input', show);
</script></body></html>
