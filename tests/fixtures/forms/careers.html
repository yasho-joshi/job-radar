<!doctype html><html><head><meta charset="utf-8"><title>Careers | Testco</title>
<style>.hide{display:none}</style></head><body>
<!-- An employer's own careers page the runner has no rules for: Apply -> sign-in -> form. -->
<h1>Senior Product Manager</h1>
<a href="#" id="apply" onclick="openApply();return false">Apply</a>
<form id="signin" class="hide" onsubmit="return false">
  <label for="acct">Email address</label><input id="acct" type="email" name="username">
  <label for="pw">Password</label><input id="pw" type="password" name="password">
  <button type="button">Sign in</button>
</form>
<form id="app" class="hide" onsubmit="window.submitted=true;return false">
  <label for="fn">First name*</label><input id="fn" required>
  <label for="ln">Last name*</label><input id="ln" required>
  <label for="em">Email*</label><input id="em" type="email" required>
  <label for="ph">Phone*</label><input id="ph" required>
  <label for="cv">Resume / CV*</label><input id="cv" type="file" required>
  <button type="submit">Submit application</button>
</form>
<script>
window.submitted = false;
function openApply(){ document.getElementById('signin').classList.remove('hide'); }
function finishSignIn(){ document.getElementById('signin').classList.add('hide');
                         document.getElementById('app').classList.remove('hide'); }
</script></body></html>
